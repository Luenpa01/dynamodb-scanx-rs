[package]
name = "dpscan" 
version = "0.1.0"
edition = "2024"
authors = ["Luis Enrique Parada <pradapop78@gmail.com>"]
description = "CLI tool for blazing fast DynamoDB parallel scanning"

[dependencies]

dynamodb-scanx-core = { path = "../core" }

tokio = { version = "1", features = ["full"] }

clap = { version = "4.4", features = ["derive"] }

indicatif = "0.17"

serde_json = "1.0"

aws-sdk-dynamodb = "1.17"
